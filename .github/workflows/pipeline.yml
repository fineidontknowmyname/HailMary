name: Weekly Content Pipeline

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly at midnight on Sunday
  workflow_dispatch:  # Allow manual trigger

jobs:
  scrape-and-process:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_API_TOKEN }}
        run: npm run -w pipeline scrape
      
      - name: Run transformers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run -w pipeline transform
      
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "Update resources and paths from pipeline"
      
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
